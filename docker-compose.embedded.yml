# docker-compose.embedded.yml — zero-config single-operator mode.
# No Postgres, no Redis — just Warrant with SQLite storage.
#
# Usage:
#   docker compose -f docker-compose.embedded.yml up
#
# First run will launch the interactive setup wizard.
# Data persists in the ./data/ volume across restarts.

services:
  warrant:
    build:
      context: .
      dockerfile: Dockerfile.embedded
    ports:
      - "8080:8080"
    environment:
      - STORAGE_MODE=embedded
      - WARRANT_DATA_DIR=/data
      - PORT=8080
    volumes:
      - warrant-data:/data
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  warrant-data:
    driver: local
