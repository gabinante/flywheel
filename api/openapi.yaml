openapi: 3.0.3
info:
  title: Flywheel API
  description: REST API for Flywheel ticketing (orgs, projects, tickets, reviews, queue).
  version: 0.1.0
servers:
  - url: http://localhost:8090
    description: Local
paths:
  /healthz:
    get:
      operationId: GetHealthz
      summary: Liveness/readiness
      responses:
        "200":
          description: OK
  /me/stats:
    get:
      operationId: GetMeStats
      summary: Lifetime stats for the authenticated agent (tickets created, reviews approved/rejected). For gamification.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeStats'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /me/stats/history:
    get:
      operationId: GetMeStatsHistory
      summary: Daily activity counts for the last N days (for activity graph). Oldest day first.
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          description: Number of days (default 14, max 90).
          schema:
            type: integer
            default: 14
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeStatsHistory'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs:
    get:
      operationId: ListOrgs
      summary: List organizations for the authenticated user (OAuth required)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Org'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: CreateOrg
      summary: Create organization (auth required)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs/{orgID}:
    get:
      operationId: GetOrg
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs/{orgID}/projects:
    get:
      operationId: ListProjectsByOrg
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Filter by project status; default active.
          schema:
            type: string
            enum: [active, closed, all]
            default: active
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      operationId: CreateProject
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}:
    get:
      operationId: GetProject
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    patch:
      operationId: UpdateProject
      summary: Update project (e.g. set status to active or closed)
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: Bad request (e.g. invalid status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/work-streams:
    get:
      operationId: ListWorkStreams
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status; default active.
          schema:
            type: string
            enum: [active, closed, all]
            default: active
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkStream'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: CreateWorkStream
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkStreamRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStream'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/work-streams/{workStreamID}:
    get:
      operationId: GetWorkStream
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: workStreamID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStream'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    patch:
      operationId: UpdateWorkStream
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: workStreamID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkStreamRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStream'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/tickets:
    get:
      operationId: ListTickets
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: work_stream_id
          in: query
          description: Filter by work stream.
          schema:
            type: string
        - name: state
          in: query
          description: Filter by ticket state.
          schema:
            type: string
            enum: [draft, planning, awaiting_input, executing, awaiting_validation, validated, closed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: CreateTicket
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}:
    get:
      operationId: GetTicket
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    patch:
      operationId: UpdateTicket
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        "204":
          description: No content
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/reviews:
    get:
      operationId: ListPendingReviews
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingReviewsResponse'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/reviews:
    post:
      operationId: CreateReview
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/trace:
    get:
      operationId: GetTrace
      summary: Execution trace (steps logged by the agent while working)
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of steps to return (descending order). Omit for all steps.
          schema:
            type: integer
            minimum: 1
            default: 200
        - name: offset
          in: query
          required: false
          description: Number of steps to skip (for pagination).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTrace'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: LogStep
      summary: Append a step to the execution trace (requires valid lease)
      security:
        - BearerAuth: []
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogStepRequest'
      responses:
        "204":
          description: No content
        "400":
          description: Bad request (e.g. missing lease_token or step.type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/transitions:
    get:
      operationId: GetTransitions
      summary: State transition history for a ticket (timeline of state changes)
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionHistory'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: TransitionTicket
      summary: Transition ticket state (e.g. start, submit, approve, reject)
      security:
        - BearerAuth: []
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad request (e.g. trigger required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/escalations:
    get:
      operationId: ListEscalations
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Escalation'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/escalations/{escalationID}/resolve:
    post:
      operationId: ResolveEscalation
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
        - name: escalationID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveEscalationRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/queue/claim:
    post:
      operationId: ClaimTicket
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponseBody'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/lease/renew:
    post:
      operationId: RenewLease
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewLeaseRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewLeaseResponseBody'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/lease:
    delete:
      operationId: ReleaseLease
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
        - name: lease_token
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lease_token:
                  type: string
      responses:
        "204":
          description: No content
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  # --- Plan endpoints (first-class plan entity) ---
  /api/v1/gate/callback/{token}:
    post:
      operationId: PostGateCallback
      summary: Receive a webhook callback that satisfies a gate condition
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Gate condition marked as satisfied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  ticket_id:
                    type: string
                  phase_id:
                    type: string
        "404":
          description: Token not found or expired
  /sessions:
    get:
      operationId: ListSessions
      summary: List tracked Claude Code and Codex sessions
      parameters:
        - name: harness
          in: query
          schema:
            type: string
            enum: [claude_code, codex]
        - name: origin
          in: query
          schema:
            type: string
            enum: [interactive, dispatched, automation, subagent]
        - name: repo
          in: query
          description: Repository as owner/name or bare name.
          schema:
            type: string
        - name: branch
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, idle, ended]
        - name: q
          in: query
          description: Full-text search over prompts, title, repo, branch, and linked refs.
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: include_subagents
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /sessions/collector:
    get:
      operationId: GetSessionCollectorStatus
      summary: Health of the session ingestion loop
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCollectorStatus'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /sessions/{sessionID}:
    get:
      operationId: GetSession
      summary: Session detail with prompts, links, and subagent children
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /sessions/{sessionID}/links:
    post:
      operationId: CreateSessionLink
      summary: Link a session to a PR, Linear issue, ticket, or review
      parameters:
        - name: sessionID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionLinkRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionLink'
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MeStats:
      type: object
      required: [tickets_created, reviews_approved, reviews_rejected]
      properties:
        tickets_created:
          type: integer
          description: Total tickets created by this agent
        reviews_approved:
          type: integer
          description: Total reviews approved by this agent
        reviews_rejected:
          type: integer
          description: Total reviews rejected by this agent
    MeStatsHistory:
      type: object
      required: [days, tickets_created, reviews_approved, reviews_rejected]
      properties:
        days:
          type: array
          items:
            type: string
            format: date
          description: Date strings (YYYY-MM-DD) oldest first
        tickets_created:
          type: array
          items:
            type: integer
          description: Ticket count per day
        reviews_approved:
          type: array
          items:
            type: integer
        reviews_rejected:
          type: array
          items:
            type: integer
    StructuredError:
      type: object
      required: [error, code, retriable]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [lease_expired, unauthorized, not_found, conflict, invalid_input, forbidden, internal, not_implemented, project_closed]
        retriable:
          type: boolean
    NotImplementedError:
      type: object
      description: Returned when server cannot access repo (e.g. git-notes without repo_path)
      properties:
        error:
          type: string
        code:
          type: string
          enum: [not_implemented]
    LogStepRequest:
      type: object
      required: [lease_token, step]
      properties:
        lease_token:
          type: string
        step:
          $ref: '#/components/schemas/TraceStepInput'
    TraceStepInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [tool_call, observation, thought, error]
        payload:
          type: object
    TransitionRequest:
      type: object
      required: [trigger]
      properties:
        trigger:
          type: string
        actor_id:
          type: string
        actor:
          type: string
          enum: [human, agent, system]
        payload:
          type: object
    Org:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
    CreateOrgRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
    Project:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          description: Short project description.
        repo_url:
          type: string
        default_branch:
          type: string
          description: Branch to checkout when closing a work stream; default "main".
        tech_stack:
          type: array
          items:
            type: string
        context_pack:
          type: object
        status:
          type: string
          enum: [active, closed]
          description: active (default) or closed; list endpoints default to active only.
        dispatch_enabled:
          type: boolean
          description: Whether the dispatcher picks up tickets for this project (default true).
        dispatch_config:
          $ref: '#/components/schemas/DispatchConfig'
        created_at:
          type: string
          format: date-time
    UpdateProjectRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, closed]
        name:
          type: string
          description: Project display name.
        description:
          type: string
          description: Short project description.
        slug:
          type: string
          description: URL-safe identifier (unique per org).
        repo_url:
          type: string
          description: Git repo URL; when set, enables work streams + git integration (branch instructions in MCP).
        default_branch:
          type: string
          description: Branch to checkout when closing a work stream; default "main".
        dispatch_enabled:
          type: boolean
          description: Whether the dispatcher picks up tickets for this project (default true). Takes effect immediately.
        dispatch_config:
          $ref: '#/components/schemas/DispatchConfig'
        context_pack:
          type: object
          description: Project context pack (system_prompt, conventions, key_files).
          properties:
            system_prompt:
              type: string
            conventions:
              type: string
            key_files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  snippet:
                    type: string
    DispatchConfig:
      type: object
      properties:
        max_active_workers:
          type: integer
          minimum: 0
          description: Maximum concurrent active workers for this project. Set 0 or omit to inherit the server DISPATCH_MAX_WORKERS default.
        roles:
          type: array
          description: Custom dispatch roles. Each role has its own routing policy and inherits prompt/tool behavior from a built-in worker type.
          items:
            $ref: '#/components/schemas/DispatchWorkerRole'
        workers:
          type: array
          items:
            $ref: '#/components/schemas/DispatchWorkerProfile'
        policies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DispatchRolePolicy'
    DispatchWorkerRole:
      type: object
      properties:
        id:
          type: string
          description: Stable custom role key used in dispatch policies and ticket inputs.
        name:
          type: string
        description:
          type: string
          description: Additional instructions appended to workers launched for this custom role.
        base_type:
          type: string
          enum: [planner, executor, validator, deployer, investigator]
          description: Built-in worker behavior this custom role inherits for prompts and tool access.
    DispatchWorkerProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        runner:
          type: string
          enum: [cli, docker, openai-responses, openai-compatible]
        driver:
          type: string
          enum: [claude, generic]
        cli_path:
          type: string
          description: Override binary path when using a CLI or Docker-backed worker.
        model:
          type: string
          description: Model override for API-native workers.
        reasoning_effort:
          type: string
          description: Reasoning effort override for API-native workers.
        api_base_url:
          type: string
          description: Base URL override for API-native workers.
        credential_env_var:
          type: string
          description: Environment variable that holds the provider credential for this worker profile.
        args:
          type: array
          items:
            type: string
    DispatchRolePolicy:
      type: object
      properties:
        selection_mode:
          type: string
          enum: [ordered, any]
          description: ordered tries workers in the configured order; any rotates across the configured workers.
        worker_ids:
          type: array
          description: Worker profile IDs to use for this role. Leave empty to use all enabled workers.
          items:
            type: string
    WorkStream:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          description: Markdown implementation plan (GFM, fenced code, Mermaid diagrams).
        branch:
          type: string
        status:
          type: string
          enum: [active, closed]
        created_at:
          type: string
          format: date-time
    CreateWorkStreamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          description: Optional Markdown plan body.
    UpdateWorkStreamRequest:
      type: object
      properties:
        name:
          type: string
        plan:
          type: string
          description: Markdown plan; send empty string to clear.
        branch:
          type: string
        status:
          type: string
          enum: [active, closed]
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        repo_url:
          type: string
        tech_stack:
          type: array
          items:
            type: string
        template_id:
          type: string
          description: "Project template ID to seed from"
        work_stream_template_ids:
          type: array
          items:
            type: string
          description: "Which workstream templates to include. If omitted with template_id, all template workstreams are included."
    Objective:
      type: object
      properties:
        description:
          type: string
        success_criteria:
          type: array
          items:
            type: string
        acceptance_test:
          type: string
    TicketContext:
      type: object
      properties:
        relevant_files:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        prior_attempts:
          type: array
          items:
            type: object
        human_answers:
          type: array
          items:
            type: string
    Ticket:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [task, bug, spike, review]
        priority:
          type: integer
          minimum: 0
          maximum: 3
        state:
          type: string
          enum: [draft, planning, awaiting_input, executing, awaiting_validation, validated, closed]
        version:
          type: integer
        objective:
          $ref: '#/components/schemas/Objective'
        ticket_context:
          $ref: '#/components/schemas/TicketContext'
        inputs:
          type: object
        outputs:
          type: object
        depends_on:
          type: array
          items:
            type: string
        work_stream_id:
          type: string
        environment_id:
          type: string
          description: Compound environment ID (spec v0.2 section 4.1)
        target_repo:
          type: string
          description: Repository alias for multi-repo projects (from project_repositories). Empty means primary repo.
        assigned_to:
          type: string
        workflow_id:
          type: string
          description: Active workflow definition ID. Empty means legacy state machine.
        workflow_phase:
          type: string
          description: Current phase ID within the workflow. Empty means no active phase.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectRepository:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        alias:
          type: string
          description: Unique alias within the project (e.g. "backend", "frontend")
        repo_url:
          type: string
          description: Git clone URL
        default_branch:
          type: string
          description: Default branch name (e.g. "main")
        is_primary:
          type: boolean
          description: Whether this is the primary repository
        created_at:
          type: string
          format: date-time
    CreateTicketRequest:
      type: object
      required: [title, created_by]
      properties:
        title:
          type: string
        work_stream_id:
          type: string
        target_repo:
          type: string
          description: Repository alias for multi-repo projects (optional)
        type:
          type: string
          enum: [task, bug, spike, review]
        priority:
          type: integer
          minimum: 0
          maximum: 3
        created_by:
          type: string
        depends_on:
          type: array
          items:
            type: string
        objective:
          $ref: '#/components/schemas/Objective'
        ticket_context:
          $ref: '#/components/schemas/TicketContext'
        idempotency_key:
          type: string
          description: Optional. Duplicate requests with the same key return the existing ticket.
    UpdateTicketRequest:
      type: object
      properties:
        depends_on:
          type: array
          items:
            type: string
        title:
          type: string
          description: When set, replaces the ticket title.
        objective:
          $ref: '#/components/schemas/Objective'
          description: Partial update; only fields present in the body are merged into the existing objective. Task/bug tickets must still have at least one of success_criteria or acceptance_test after the merge.
    CreateReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected, reopened]
          description: >
            approved moves awaiting_validation → validated; rejected moves awaiting_validation → executing;
            reopened moves closed → draft (re-opens ticket for new lifecycle).
        notes:
          type: string
        reviewer_id:
          type: string
    ExecutionTrace:
      type: object
      properties:
        ticket_id:
          type: string
        agent_id:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TraceStep'
        total_count:
          type: integer
          description: Total number of steps for this ticket (present when paginated)
    TraceStep:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [tool_call, observation, thought, error]
        payload:
          type: object
        created_at:
          type: string
          format: date-time
    PendingReviewsResponse:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
    Escalation:
      type: object
      properties:
        id:
          type: string
        ticket_id:
          type: string
        agent_id:
          type: string
        reason:
          type: string
        question:
          type: string
        answer:
          type: string
        resolved_by:
          type: string
        resolved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    ResolveEscalationRequest:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
        reviewer_id:
          type: string
    ClaimRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
        priority:
          type: integer
          minimum: 0
          maximum: 3
        idempotency_key:
          type: string
          description: Optional. Retries with the same key return the same ticket/lease (renewed or re-claimed).
    ClaimResponseBody:
      type: object
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        lease:
          $ref: '#/components/schemas/Lease'
    Lease:
      type: object
      properties:
        ticket_id:
          type: string
        agent_id:
          type: string
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        renewable:
          type: boolean
    RenewLeaseRequest:
      type: object
      required: [lease_token]
      properties:
        lease_token:
          type: string
    RenewLeaseResponseBody:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
    TransitionHistory:
      type: object
      properties:
        ticket_id:
          type: string
        current_state:
          type: string
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/StateTransitionEntry'
    StateTransitionEntry:
      type: object
      properties:
        id:
          type: string
        from_state:
          type: string
        to_state:
          type: string
        trigger:
          type: string
        actor_id:
          type: string
        actor_type:
          type: string
          enum: [human, agent, system]
        created_at:
          type: string
          format: date-time
    # --- Plan schemas ---
    # --- Policy calibration schemas ---
    GateCondition:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [github_checks, human_approval, webhook, http_check]
        config:
          type: object
          additionalProperties: true
    GateRequirement:
      type: object
      properties:
        type:
          type: string
          enum: [github_checks, human_approval, webhook, http_check]
        config:
          type: object
          additionalProperties: true
      required:
        - type
    GateRequirementStatus:
      type: object
      properties:
        requirement:
          $ref: '#/components/schemas/GateRequirement'
        satisfied:
          type: boolean
        reason:
          type: string
        checked_at:
          type: string
          format: date-time
    # ── Workflow Definitions ──────────────────────────────────────────
    WorkflowPhase:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [agent, external, gate, action, manual, automated, deploy, observe]
        description:
          type: string
        config:
          type: object
          additionalProperties: true
        on_failure:
          type: string
    WorkflowDefinition:
      type: object
      required: [name, phases]
      properties:
        id:
          type: string
        scope:
          type: string
          enum: [system, org, project]
        scope_id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        phases:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPhase'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    WorkflowPosition:
      type: object
      properties:
        workflow_id:
          type: string
        workflow_name:
          type: string
        current_phase:
          $ref: '#/components/schemas/WorkflowPhase'
        phase_index:
          type: integer
        total_phases:
          type: integer
        history:
          type: array
          items:
            $ref: '#/components/schemas/PhaseCompletion'
    PhaseCompletion:
      type: object
      properties:
        id:
          type: string
        ticket_id:
          type: string
        workflow_id:
          type: string
        phase_id:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum: [success, failed, skipped]
        metadata:
          type: object
          additionalProperties: true
    AgentSession:
      type: object
      description: One tracked Claude Code or Codex session.
      required: [id, harness, external_id, origin, cwd, repo, branch, model, reasoning_effort, title, first_prompt, transcript_path, tokens_in, tokens_out, prompt_count, tool_call_count, started_at, last_activity_at, status, links]
      properties:
        id:
          type: string
        harness:
          type: string
          description: claude_code or codex
        external_id:
          type: string
          description: The harness's own session or thread id
        origin:
          type: string
          description: interactive, dispatched, automation, or subagent
        parent_session_id:
          type: string
        cwd:
          type: string
        repo:
          type: string
        branch:
          type: string
        model:
          type: string
        reasoning_effort:
          type: string
        title:
          type: string
        first_prompt:
          type: string
        transcript_path:
          type: string
        tokens_in:
          type: integer
          format: int64
        tokens_out:
          type: integer
          format: int64
        prompt_count:
          type: integer
        tool_call_count:
          type: integer
        started_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        status:
          type: string
          description: active, idle, or ended (derived from recency)
        links:
          type: array
          items:
            $ref: '#/components/schemas/SessionLink'
        metadata:
          type: object
          additionalProperties: true
    SessionLink:
      type: object
      required: [session_id, kind, ref, source, created_at]
      properties:
        session_id:
          type: string
        kind:
          type: string
          description: pr, linear_issue, ticket, or review
        ref:
          type: string
          description: owner/repo#123, KEY-123, ticket id, or review request id
        source:
          type: string
          description: inferred, explicit, or dispatch
        created_at:
          type: string
          format: date-time
    SessionPrompt:
      type: object
      required: [seq, role, text, ts]
      properties:
        seq:
          type: integer
        role:
          type: string
        text:
          type: string
        ts:
          type: string
          format: date-time
    SessionDetail:
      type: object
      required: [session, prompts, children]
      properties:
        session:
          $ref: '#/components/schemas/AgentSession'
        prompts:
          type: array
          items:
            $ref: '#/components/schemas/SessionPrompt'
        children:
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'
    SessionListResponse:
      type: object
      required: [sessions, total, limit, offset]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    CreateSessionLinkRequest:
      type: object
      required: [kind, ref]
      properties:
        kind:
          type: string
          enum: [pr, linear_issue, ticket, review]
        ref:
          type: string
    SessionCollectorStatus:
      type: object
      required: [enabled, claude_dir, codex_dir, last_duration_ms, sessions_total, by_harness]
      properties:
        enabled:
          type: boolean
        claude_dir:
          type: string
        codex_dir:
          type: string
        last_run_at:
          type: string
          format: date-time
        last_error:
          type: string
        last_duration_ms:
          type: integer
          format: int64
        sessions_total:
          type: integer
        by_harness:
          type: object
          additionalProperties:
            type: integer
