components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MeStats:
      type: object
      required: [tickets_created, reviews_approved, reviews_rejected]
      properties:
        tickets_created:
          type: integer
          description: Total tickets created by this agent
        reviews_approved:
          type: integer
          description: Total reviews approved by this agent
        reviews_rejected:
          type: integer
          description: Total reviews rejected by this agent
    MeStatsHistory:
      type: object
      required: [days, tickets_created, reviews_approved, reviews_rejected]
      properties:
        days:
          type: array
          items:
            type: string
            format: date
          description: Date strings (YYYY-MM-DD) oldest first
        tickets_created:
          type: array
          items:
            type: integer
          description: Ticket count per day
        reviews_approved:
          type: array
          items:
            type: integer
        reviews_rejected:
          type: array
          items:
            type: integer
    StructuredError:
      type: object
      required: [error, code, retriable]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [lease_expired, unauthorized, not_found, conflict, invalid_input, forbidden, internal, not_implemented, project_closed]
        retriable:
          type: boolean
    NotImplementedError:
      type: object
      description: Returned when server cannot access repo (e.g. git-notes without repo_path)
      properties:
        error:
          type: string
        code:
          type: string
          enum: [not_implemented]
    LogStepRequest:
      type: object
      required: [lease_token, step]
      properties:
        lease_token:
          type: string
        step:
          $ref: '#/components/schemas/TraceStepInput'
    TraceStepInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [tool_call, observation, thought, error]
        payload:
          type: object
    TransitionRequest:
      type: object
      required: [trigger]
      properties:
        trigger:
          type: string
        actor_id:
          type: string
        actor:
          type: string
          enum: [human, agent, system]
        payload:
          type: object
    Org:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
    CreateOrgRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
    Project:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          description: Short project description.
        repo_url:
          type: string
        default_branch:
          type: string
          description: Branch to checkout when closing a work stream; default "main".
        tech_stack:
          type: array
          items:
            type: string
        context_pack:
          type: object
        status:
          type: string
          enum: [active, closed]
          description: active (default) or closed; list endpoints default to active only.
        dispatch_enabled:
          type: boolean
          description: Whether the dispatcher picks up tickets for this project (default true).
        dispatch_config:
          $ref: '#/components/schemas/DispatchConfig'
        created_at:
          type: string
          format: date-time
    UpdateProjectRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, closed]
        name:
          type: string
          description: Project display name.
        description:
          type: string
          description: Short project description.
        slug:
          type: string
          description: URL-safe identifier (unique per org).
        repo_url:
          type: string
          description: Git repo URL; when set, enables work streams + git integration (branch instructions in MCP).
        default_branch:
          type: string
          description: Branch to checkout when closing a work stream; default "main".
        dispatch_enabled:
          type: boolean
          description: Whether the dispatcher picks up tickets for this project (default true). Takes effect immediately.
        dispatch_config:
          $ref: '#/components/schemas/DispatchConfig'
        context_pack:
          type: object
          description: Project context pack (system_prompt, conventions, key_files).
          properties:
            system_prompt:
              type: string
            conventions:
              type: string
            key_files:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  snippet:
                    type: string
    DispatchConfig:
      type: object
      properties:
        max_active_workers:
          type: integer
          minimum: 0
          description: Maximum concurrent active workers for this project. Set 0 or omit to inherit the server DISPATCH_MAX_WORKERS default.
        roles:
          type: array
          description: Custom dispatch roles. Each role has its own routing policy and inherits prompt/tool behavior from a built-in worker type.
          items:
            $ref: '#/components/schemas/DispatchWorkerRole'
        workers:
          type: array
          items:
            $ref: '#/components/schemas/DispatchWorkerProfile'
        policies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DispatchRolePolicy'
    DispatchWorkerRole:
      type: object
      properties:
        id:
          type: string
          description: Stable custom role key used in dispatch policies and ticket inputs.
        name:
          type: string
        description:
          type: string
          description: Additional instructions appended to workers launched for this custom role.
        base_type:
          type: string
          enum: [planner, executor, validator, deployer, investigator]
          description: Built-in worker behavior this custom role inherits for prompts and tool access.
    DispatchWorkerProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        runner:
          type: string
          enum: [cli, docker, openai-responses, openai-compatible]
        driver:
          type: string
          enum: [claude, generic]
        cli_path:
          type: string
          description: Override binary path when using a CLI or Docker-backed worker.
        model:
          type: string
          description: Model override for API-native workers.
        reasoning_effort:
          type: string
          description: Reasoning effort override for API-native workers.
        api_base_url:
          type: string
          description: Base URL override for API-native workers.
        credential_env_var:
          type: string
          description: Environment variable that holds the provider credential for this worker profile.
        args:
          type: array
          items:
            type: string
    DispatchRolePolicy:
      type: object
      properties:
        selection_mode:
          type: string
          enum: [ordered, any]
          description: ordered tries workers in the configured order; any rotates across the configured workers.
        worker_ids:
          type: array
          description: Worker profile IDs to use for this role. Leave empty to use all enabled workers.
          items:
            type: string
    WorkStream:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          description: Markdown implementation plan (GFM, fenced code, Mermaid diagrams).
        branch:
          type: string
        status:
          type: string
          enum: [active, closed]
        created_at:
          type: string
          format: date-time
    CreateWorkStreamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          description: Optional Markdown plan body.
    UpdateWorkStreamRequest:
      type: object
      properties:
        name:
          type: string
        plan:
          type: string
          description: Markdown plan; send empty string to clear.
        branch:
          type: string
        status:
          type: string
          enum: [active, closed]
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        repo_url:
          type: string
        tech_stack:
          type: array
          items:
            type: string
        template_id:
          type: string
          description: "Project template ID to seed from"
        work_stream_template_ids:
          type: array
          items:
            type: string
          description: "Which workstream templates to include. If omitted with template_id, all template workstreams are included."
    Objective:
      type: object
      properties:
        description:
          type: string
        success_criteria:
          type: array
          items:
            type: string
        acceptance_test:
          type: string
    TicketContext:
      type: object
      properties:
        relevant_files:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        prior_attempts:
          type: array
          items:
            type: object
        human_answers:
          type: array
          items:
            type: string
    Ticket:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [task, bug, spike, review]
        priority:
          type: integer
          minimum: 0
          maximum: 3
        state:
          type: string
          enum: [draft, planning, awaiting_input, executing, awaiting_validation, validated, closed]
        version:
          type: integer
        objective:
          $ref: '#/components/schemas/Objective'
        ticket_context:
          $ref: '#/components/schemas/TicketContext'
        inputs:
          type: object
        outputs:
          type: object
        depends_on:
          type: array
          items:
            type: string
        work_stream_id:
          type: string
        environment_id:
          type: string
          description: Compound environment ID (spec v0.2 section 4.1)
        target_repo:
          type: string
          description: Repository alias for multi-repo projects (from project_repositories). Empty means primary repo.
        assigned_to:
          type: string
        workflow_id:
          type: string
          description: Active workflow definition ID. Empty means legacy state machine.
        workflow_phase:
          type: string
          description: Current phase ID within the workflow. Empty means no active phase.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        external:
          $ref: '#/components/schemas/TicketExternalRef'
    TicketExternalRef:
      type: object
      description: Projection of the external tracker issue (Linear) this ticket mirrors.
      required: [provider, external_id, identifier, priority, synced_at]
      properties:
        provider:
          type: string
        external_id:
          type: string
        identifier:
          type: string
          description: e.g. RLETD-465
        url:
          type: string
        state_name:
          type: string
        state_type:
          type: string
          description: triage, backlog, unstarted, started, completed, or canceled
        assignee:
          type: string
        team_key:
          type: string
        priority:
          type: integer
          description: Linear priority 0 (none) to 4 (low)
        labels:
          type: array
          items:
            type: string
        branch_name:
          type: string
        updated_at:
          type: string
          format: date-time
