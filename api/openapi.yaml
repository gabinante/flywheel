      required:
        - type
    GateRequirementStatus:
      type: object
      properties:
        requirement:
          $ref: '#/components/schemas/GateRequirement'
        satisfied:
          type: boolean
        reason:
          type: string
        checked_at:
          type: string
          format: date-time
    PolicyChangeEvent:
      type: object
      properties:
