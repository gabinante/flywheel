openapi: 3.0.3
info:
  title: Flywheel API
  description: REST API for Flywheel ticketing (orgs, projects, tickets, reviews, queue).
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /healthz:
    get:
      operationId: GetHealthz
      summary: Liveness/readiness
      responses:
        "200":
          description: OK
  /me/stats:
    get:
      operationId: GetMeStats
      summary: Lifetime stats for the authenticated agent (tickets created, reviews approved/rejected). For gamification.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeStats'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /me/stats/history:
    get:
      operationId: GetMeStatsHistory
      summary: Daily activity counts for the last N days (for activity graph). Oldest day first.
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          description: Number of days (default 14, max 90).
          schema:
            type: integer
            default: 14
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeStatsHistory'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs:
    get:
      operationId: ListOrgs
      summary: List organizations for the authenticated user (OAuth required)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Org'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: CreateOrg
      summary: Create organization (auth required)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs/{orgID}:
    get:
      operationId: GetOrg
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs/{orgID}/projects:
    get:
      operationId: ListProjectsByOrg
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Filter by project status; default active.
          schema:
            type: string
            enum: [active, closed, all]
            default: active
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      operationId: CreateProject
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}:
    get:
      operationId: GetProject
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    patch:
      operationId: UpdateProject
      summary: Update project (e.g. set status to active or closed)
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: Bad request (e.g. invalid status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/work-streams:
    get:
      operationId: ListWorkStreams
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status; default active.
          schema:
            type: string
            enum: [active, closed, all]
            default: active
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkStream'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: CreateWorkStream
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkStreamRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStream'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/work-streams/{workStreamID}:
    get:
      operationId: GetWorkStream
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: workStreamID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStream'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    patch:
      operationId: UpdateWorkStream
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: workStreamID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkStreamRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStream'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/environments:
    get:
      operationId: ListEnvironments
      summary: List all environments for a project
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Environment'
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: CreateEnvironment
      summary: Create a new environment for a project (compound tuple)
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /environments/{environmentID}:
    get:
      operationId: GetEnvironment
      summary: Get an environment by ID
      parameters:
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    put:
      operationId: UpdateEnvironment
      summary: Update an environment's compound tuple dimensions
      parameters:
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnvironmentRequest'
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    delete:
      operationId: DeleteEnvironment
      summary: Delete an environment (enforces minimum-two constraint)
      parameters:
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete (default or minimum constraint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /environments/{environmentID}/set-default:
    post:
      operationId: SetDefaultEnvironment
      summary: Set an environment as the default for its project
      parameters:
        - name: environmentID
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Default set
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/tickets:
    get:
      operationId: ListTickets
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: work_stream_id
          in: query
          description: Filter by work stream.
          schema:
            type: string
        - name: state
          in: query
          description: Filter by ticket state.
          schema:
            type: string
            enum: [draft, planning, awaiting_input, executing, awaiting_validation, validated, closed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: CreateTicket
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}:
    get:
      operationId: GetTicket
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    patch:
      operationId: UpdateTicket
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        "204":
          description: No content
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/reviews:
    get:
      operationId: ListPendingReviews
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingReviewsResponse'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/reviews:
    post:
      operationId: CreateReview
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/trace:
    get:
      operationId: GetTrace
      summary: Execution trace (steps logged by the agent while working)
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of steps to return (descending order). Omit for all steps.
          schema:
            type: integer
            minimum: 1
            default: 200
        - name: offset
          in: query
          required: false
          description: Number of steps to skip (for pagination).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTrace'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: LogStep
      summary: Append a step to the execution trace (requires valid lease)
      security:
        - BearerAuth: []
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogStepRequest'
      responses:
        "204":
          description: No content
        "400":
          description: Bad request (e.g. missing lease_token or step.type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/transitions:
    get:
      operationId: GetTransitions
      summary: State transition history for a ticket (timeline of state changes)
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionHistory'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: TransitionTicket
      summary: Transition ticket state (e.g. start, submit, approve, reject)
      security:
        - BearerAuth: []
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad request (e.g. trigger required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs/{orgID}/projects/{projectID}/git-notes/commits/{commitSha}:
    get:
      operationId: GetCommitNotes
      summary: Get git notes for a commit (requires repo_path query; server returns 501 if repo not accessible)
      security:
        - BearerAuth: []
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: commitSha
          in: path
          required: true
          schema:
            type: string
        - name: repo_path
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: Note type (decision, trace, or intent); omit for all types
          schema:
            type: string
            enum: [decision, trace, intent]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitNotesResponse'
        "404":
          description: Not found (project or org mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "501":
          description: Not implemented (repo_path missing or not a git repo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedError'
  /orgs/{orgID}/projects/{projectID}/git-notes/log:
    get:
      operationId: GetGitNotesLog
      summary: List commits with notes (requires repo_path query; server returns 501 if repo not accessible)
      security:
        - BearerAuth: []
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: repo_path
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: Note type (default decision)
          schema:
            type: string
            enum: [decision, trace, intent]
            default: decision
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitNotesLogResponse'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "501":
          description: Not implemented (repo_path missing or not a git repo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedError'
  /projects/{projectID}/escalations:
    get:
      operationId: ListEscalations
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Escalation'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/escalations/{escalationID}/resolve:
    post:
      operationId: ResolveEscalation
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
        - name: escalationID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveEscalationRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/policies:
    get:
      operationId: ListPolicies
      summary: List advancement policies for a project
      security:
        - BearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: enabled
          in: query
          description: Filter to enabled policies only.
          schema:
            type: string
            enum: ["true", "false"]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyListResponse'
    post:
      operationId: CreatePolicy
      summary: Create a new advancement policy
      security:
        - BearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/policies/health:
    get:
      operationId: GetProjectPolicyHealth
      summary: Policy health view showing all policies with outcome statistics, proposals, and edit history
      security:
        - BearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectHealthResponse'
  /projects/{projectID}/policies/calibrate:
    post:
      operationId: RunCalibration
      summary: Run calibration feedback loop — analyzes metrics and generates broadening or review proposals
      security:
        - BearerAuth: []
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationResponse'
  /policies/{policyID}:
    get:
      operationId: GetPolicy
      summary: Get a single policy by ID
      security:
        - BearerAuth: []
      parameters:
        - name: policyID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    put:
      operationId: UpdatePolicy
      summary: Update a policy (records a change event in the stream)
      security:
        - BearerAuth: []
      parameters:
        - name: policyID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRequest'
      responses:
        "200":
          description: OK
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /policies/{policyID}/health:
    get:
      operationId: GetPolicyHealth
      summary: Get health view for a single policy with metrics, proposals, and change history
      security:
        - BearerAuth: []
      parameters:
        - name: policyID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyHealth'
  /policies/{policyID}/metrics:
    get:
      operationId: GetPolicyMetrics
      summary: Get computed per-policy metrics (auto-approval rate, rollback rate, incident rate)
      security:
        - BearerAuth: []
      parameters:
        - name: policyID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyMetrics'
  /policies/{policyID}/decisions:
    get:
      operationId: ListPolicyDecisions
      summary: List rolling record of gated decisions with outcomes
      security:
        - BearerAuth: []
      parameters:
        - name: policyID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDecisionsResponse'
    post:
      operationId: RecordPolicyDecision
      summary: Record a policy decision on a ticket
      security:
        - BearerAuth: []
      parameters:
        - name: policyID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordDecisionRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyDecision'
  /policies/{policyID}/history:
    get:
      operationId: ListPolicyChangeEvents
      summary: List auditable change events for a policy (edit history)
      security:
        - BearerAuth: []
      parameters:
        - name: policyID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyChangeEventsResponse'
  /policies/{policyID}/simulate:
    post:
      operationId: SimulateRuleChange
      summary: Simulate candidate rule changes against last N days of historical tickets before committing
      security:
        - BearerAuth: []
      parameters:
        - name: policyID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'
  /proposals/{proposalID}/resolve:
    post:
      operationId: ResolveProposal
      summary: Accept, reject, or dismiss a system-generated proposal (broadening is never automatic)
      security:
        - BearerAuth: []
      parameters:
        - name: proposalID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveProposalRequest'
      responses:
        "200":
          description: OK
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/outcome:
    post:
      operationId: RecordTicketOutcome
      summary: Record the outcome (success, rollback, incident) for all policy decisions on a ticket
      security:
        - BearerAuth: []
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordOutcomeRequest'
      responses:
        "200":
          description: OK
  /projects/{projectID}/queue/claim:
    post:
      operationId: ClaimTicket
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponseBody'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/lease/renew:
    post:
      operationId: RenewLease
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewLeaseRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewLeaseResponseBody'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/lease:
    delete:
      operationId: ReleaseLease
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
        - name: lease_token
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lease_token:
                  type: string
      responses:
        "204":
          description: No content
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  # --- Plan endpoints (first-class plan entity) ---
  /plans:
    post:
      operationId: CreatePlan
      summary: Create a typed execution plan for a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        "400":
          description: Bad request (validation failure — e.g., invalid DDL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /plans/{planID}:
    get:
      operationId: GetPlan
      summary: Get a plan by ID
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /plans/{planID}/content:
    put:
      operationId: UpdatePlanContent
      summary: Update plan content (draft state only, re-validates against backend schema)
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanContentRequest'
      responses:
        "204":
          description: Updated
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /plans/{planID}/transition:
    post:
      operationId: TransitionPlan
      summary: Transition plan state (submit, classify, approve, apply, reject)
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [submit, classify, approve, apply, reject]
      responses:
        "200":
          description: Transitioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /plans/{planID}/versions:
    get:
      operationId: ListPlanVersions
      summary: List version history of a plan
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanVersion'
  /plans/{planID}/freshness:
    get:
      operationId: CheckPlanFreshness
      summary: Check if a plan is still fresh (not expired for re-plan-before-apply)
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_id:
                    type: string
                  fresh:
                    type: boolean
  /tickets/{ticketID}/plans:
    get:
      operationId: ListPlansByTicket
      summary: List all plans linked to a ticket
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
        - name: backend
          in: query
          description: Filter by backend type
          schema:
            type: string
            enum: [database, terraform, code, shell, deploy]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'

  /api/v1/gate/callback/{token}:
    post:
      operationId: PostGateCallback
      summary: Receive a webhook callback that satisfies a gate condition
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Gate condition marked as satisfied
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  ticket_id:
                    type: string
                  phase_id:
                    type: string
        "404":
          description: Token not found or expired
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Environment:
      type: object
      required: [id, project_id, name, slug, infrastructure, data_tenancy, integration_mode, is_default, created_at, updated_at]
      description: >
        Compound environment tuple per spec v0.2 section 4.1. Each environment
        has three dimensions: infrastructure (dev/staging/prod), data tenancy
        (synthetic/anonymized/real), and integration mode (sandbox/test/live).
        Ticket states become environment-qualified (e.g. executing-dev).
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
          description: Display name (e.g. "Development", "Staging")
        slug:
          type: string
          description: URL-safe identifier (e.g. "dev", "staging")
        infrastructure:
          type: string
          enum: [dev, staging, prod]
          description: Infrastructure tier dimension
        data_tenancy:
          type: string
          enum: [synthetic, anonymized, real]
          description: Data tenancy dimension
        integration_mode:
          type: string
          enum: [sandbox, test, live]
          description: Integration mode dimension
        is_default:
          type: boolean
          description: Whether this is the default environment for the project
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateEnvironmentRequest:
      type: object
      required: [name, infrastructure, data_tenancy, integration_mode]
      properties:
        name:
          type: string
          description: Display name
        slug:
          type: string
          description: URL-safe slug (auto-generated from name if omitted)
        infrastructure:
          type: string
          enum: [dev, staging, prod]
        data_tenancy:
          type: string
          enum: [synthetic, anonymized, real]
        integration_mode:
          type: string
          enum: [sandbox, test, live]
    UpdateEnvironmentRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        infrastructure:
          type: string
          enum: [dev, staging, prod]
        data_tenancy:
          type: string
          enum: [synthetic, anonymized, real]
        integration_mode:
          type: string
          enum: [sandbox, test, live]
    MeStats:
      type: object
      required: [tickets_created, reviews_approved, reviews_rejected]
      properties:
        tickets_created:
          type: integer
          description: Total tickets created by this agent
        reviews_approved:
          type: integer
          description: Total reviews approved by this agent
        reviews_rejected:
          type: integer
          description: Total reviews rejected by this agent
    MeStatsHistory:
      type: object
      required: [days, tickets_created, reviews_approved, reviews_rejected]
      properties:
        days:
          type: array
          items:
            type: string
            format: date
          description: Date strings (YYYY-MM-DD) oldest first
        tickets_created:
          type: array
          items:
            type: integer
          description: Ticket count per day
        reviews_approved:
          type: array
          items:
            type: integer
        reviews_rejected:
          type: array
          items:
            type: integer
    StructuredError:
      type: object
      required: [error, code, retriable]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [lease_expired, unauthorized, not_found, conflict, invalid_input, forbidden, internal, not_implemented, project_closed]
        retriable:
          type: boolean
    NotImplementedError:
      type: object
      description: Returned when server cannot access repo (e.g. git-notes without repo_path)
      properties:
        error:
          type: string
        code:
          type: string
          enum: [not_implemented]
    LogStepRequest:
      type: object
      required: [lease_token, step]
      properties:
        lease_token:
          type: string
        step:
          $ref: '#/components/schemas/TraceStepInput'
    TraceStepInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [tool_call, observation, thought, error]
        payload:
          type: object
    TransitionRequest:
      type: object
      required: [trigger]
      properties:
        trigger:
          type: string
        actor_id:
          type: string
        actor:
          type: string
          enum: [human, agent, system]
        payload:
          type: object
    CommitNotesResponse:
      type: object
      properties:
        commit_sha:
          type: string
        notes:
          type: object
          additionalProperties:
            type: string
    GitNotesLogResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/GitNotesLogEntry'
    GitNotesLogEntry:
      type: object
      properties:
        commit_sha:
          type: string
        ref:
          type: string
        body:
          type: string
    Org:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
    CreateOrgRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
    Project:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          description: Short project description.
        repo_url:
          type: string
        default_branch:
          type: string
          description: Branch to checkout when closing a work stream; default "main".
        tech_stack:
          type: array
          items:
            type: string
        context_pack:
          type: object
        status:
          type: string
          enum: [active, closed]
          description: active (default) or closed; list endpoints default to active only.
        dispatch_enabled:
          type: boolean
          description: Whether the dispatcher picks up tickets for this project (default true).
        dispatch_config:
          $ref: '#/components/schemas/DispatchConfig'
        created_at:
          type: string
          format: date-time
    UpdateProjectRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, closed]
        name:
          type: string
          description: Project display name.
        description:
          type: string
          description: Short project description.
        slug:
          type: string
          description: URL-safe identifier (unique per org).
        repo_url:
          type: string
          description: Git repo URL; when set, enables work streams + git integration (branch instructions in MCP).
        default_branch:
          type: string
          description: Branch to checkout when closing a work stream; default "main".
        dispatch_enabled:
          type: boolean
          description: Whether the dispatcher picks up tickets for this project (default true). Takes effect immediately.
        dispatch_config:
          $ref: '#/components/schemas/DispatchConfig'
    DispatchConfig:
      type: object
      properties:
        max_active_workers:
          type: integer
          minimum: 0
          description: Maximum concurrent active workers for this project. Set 0 or omit to inherit the server DISPATCH_MAX_WORKERS default.
        roles:
          type: array
          description: Custom dispatch roles. Each role has its own routing policy and inherits prompt/tool behavior from a built-in worker type.
          items:
            $ref: '#/components/schemas/DispatchWorkerRole'
        workers:
          type: array
          items:
            $ref: '#/components/schemas/DispatchWorkerProfile'
        policies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DispatchRolePolicy'
    DispatchWorkerRole:
      type: object
      properties:
        id:
          type: string
          description: Stable custom role key used in dispatch policies and ticket inputs.
        name:
          type: string
        description:
          type: string
          description: Additional instructions appended to workers launched for this custom role.
        base_type:
          type: string
          enum: [planner, executor, validator, deployer, investigator]
          description: Built-in worker behavior this custom role inherits for prompts and tool access.
    DispatchWorkerProfile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        runner:
          type: string
          enum: [cli, docker, openai-responses, openai-compatible]
        driver:
          type: string
          enum: [claude, codex, generic]
        cli_path:
          type: string
          description: Override binary path when using a CLI or Docker-backed worker.
        model:
          type: string
          description: Model override for API-native workers.
        reasoning_effort:
          type: string
          description: Reasoning effort override for API-native workers.
        api_base_url:
          type: string
          description: Base URL override for API-native workers.
        credential_env_var:
          type: string
          description: Environment variable that holds the provider credential for this worker profile.
        args:
          type: array
          items:
            type: string
    DispatchRolePolicy:
      type: object
      properties:
        selection_mode:
          type: string
          enum: [ordered, any]
          description: ordered tries workers in the configured order; any rotates across the configured workers.
        worker_ids:
          type: array
          description: Worker profile IDs to use for this role. Leave empty to use all enabled workers.
          items:
            type: string
    WorkStream:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          description: Markdown implementation plan (GFM, fenced code, Mermaid diagrams).
        branch:
          type: string
        status:
          type: string
          enum: [active, closed]
        created_at:
          type: string
          format: date-time
    CreateWorkStreamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          description: Optional Markdown plan body.
    UpdateWorkStreamRequest:
      type: object
      properties:
        name:
          type: string
        plan:
          type: string
          description: Markdown plan; send empty string to clear.
        branch:
          type: string
        status:
          type: string
          enum: [active, closed]
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        repo_url:
          type: string
        tech_stack:
          type: array
          items:
            type: string
        template_id:
          type: string
          description: "Project template ID to seed from"
        work_stream_template_ids:
          type: array
          items:
            type: string
          description: "Which workstream templates to include. If omitted with template_id, all template workstreams are included."
    Objective:
      type: object
      properties:
        description:
          type: string
        success_criteria:
          type: array
          items:
            type: string
        acceptance_test:
          type: string
    TicketContext:
      type: object
      properties:
        relevant_files:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        prior_attempts:
          type: array
          items:
            type: object
        human_answers:
          type: array
          items:
            type: string
    Ticket:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [task, bug, spike, review]
        priority:
          type: integer
          minimum: 0
          maximum: 3
        state:
          type: string
          enum: [draft, planning, awaiting_input, executing, awaiting_validation, validated, closed]
        version:
          type: integer
        objective:
          $ref: '#/components/schemas/Objective'
        ticket_context:
          $ref: '#/components/schemas/TicketContext'
        inputs:
          type: object
        outputs:
          type: object
        depends_on:
          type: array
          items:
            type: string
        work_stream_id:
          type: string
        environment_id:
          type: string
          description: Compound environment ID (spec v0.2 section 4.1)
        target_repo:
          type: string
          description: Repository alias for multi-repo projects (from project_repositories). Empty means primary repo.
        assigned_to:
          type: string
        workflow_id:
          type: string
          description: Active workflow definition ID. Empty means legacy state machine.
        workflow_phase:
          type: string
          description: Current phase ID within the workflow. Empty means no active phase.
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectRepository:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        alias:
          type: string
          description: Unique alias within the project (e.g. "backend", "frontend")
        repo_url:
          type: string
          description: Git clone URL
        default_branch:
          type: string
          description: Default branch name (e.g. "main")
        is_primary:
          type: boolean
          description: Whether this is the primary repository
        created_at:
          type: string
          format: date-time
    CreateTicketRequest:
      type: object
      required: [title, created_by]
      properties:
        title:
          type: string
        work_stream_id:
          type: string
        target_repo:
          type: string
          description: Repository alias for multi-repo projects (optional)
        type:
          type: string
          enum: [task, bug, spike, review]
        priority:
          type: integer
          minimum: 0
          maximum: 3
        created_by:
          type: string
        depends_on:
          type: array
          items:
            type: string
        objective:
          $ref: '#/components/schemas/Objective'
        ticket_context:
          $ref: '#/components/schemas/TicketContext'
        idempotency_key:
          type: string
          description: Optional. Duplicate requests with the same key return the existing ticket.
    UpdateTicketRequest:
      type: object
      properties:
        depends_on:
          type: array
          items:
            type: string
        title:
          type: string
          description: When set, replaces the ticket title.
        objective:
          $ref: '#/components/schemas/Objective'
          description: Partial update; only fields present in the body are merged into the existing objective. Task/bug tickets must still have at least one of success_criteria or acceptance_test after the merge.
    CreateReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected, reopened]
          description: >
            approved moves awaiting_validation → validated; rejected moves awaiting_validation → executing;
            reopened moves closed → draft (re-opens ticket for new lifecycle).
        notes:
          type: string
        reviewer_id:
          type: string
    ExecutionTrace:
      type: object
      properties:
        ticket_id:
          type: string
        agent_id:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TraceStep'
        total_count:
          type: integer
          description: Total number of steps for this ticket (present when paginated)
    TraceStep:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [tool_call, observation, thought, error]
        payload:
          type: object
        created_at:
          type: string
          format: date-time
    PendingReviewsResponse:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
    Escalation:
      type: object
      properties:
        id:
          type: string
        ticket_id:
          type: string
        agent_id:
          type: string
        reason:
          type: string
        question:
          type: string
        answer:
          type: string
        resolved_by:
          type: string
        resolved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    ResolveEscalationRequest:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
        reviewer_id:
          type: string
    ClaimRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
        priority:
          type: integer
          minimum: 0
          maximum: 3
        idempotency_key:
          type: string
          description: Optional. Retries with the same key return the same ticket/lease (renewed or re-claimed).
    ClaimResponseBody:
      type: object
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        lease:
          $ref: '#/components/schemas/Lease'
    Lease:
      type: object
      properties:
        ticket_id:
          type: string
        agent_id:
          type: string
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        renewable:
          type: boolean
    RenewLeaseRequest:
      type: object
      required: [lease_token]
      properties:
        lease_token:
          type: string
    RenewLeaseResponseBody:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
    TransitionHistory:
      type: object
      properties:
        ticket_id:
          type: string
        current_state:
          type: string
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/StateTransitionEntry'
    StateTransitionEntry:
      type: object
      properties:
        id:
          type: string
        from_state:
          type: string
        to_state:
          type: string
        trigger:
          type: string
        actor_id:
          type: string
        actor_type:
          type: string
          enum: [human, agent, system]
        created_at:
          type: string
          format: date-time
    # --- Plan schemas ---
    Plan:
      type: object
      properties:
        id:
          type: string
        ticket_id:
          type: string
        backend:
          type: string
          enum: [database, terraform, code, shell, deploy]
        state:
          type: string
          enum: [draft, submitted, classified, approved, applied, superseded, rejected]
        version:
          type: integer
        content:
          $ref: '#/components/schemas/PlanContent'
        freshness_stamp:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlanContent:
      type: object
      description: >
        Union type — exactly one backend sub-schema is populated.
        No untyped escape hatch; agent cannot express classification-evading content.
      properties:
        database:
          $ref: '#/components/schemas/DatabasePlan'
        terraform:
          $ref: '#/components/schemas/TerraformPlan'
        code:
          $ref: '#/components/schemas/CodePlan'
        shell:
          $ref: '#/components/schemas/ShellPlan'
        deploy:
          $ref: '#/components/schemas/DeployPlan'
    DatabasePlan:
      type: object
      required: [migration_name, ddl, direction]
      description: Database migration plan. DDL must be valid SQL — prose fails validation.
      properties:
        migration_name:
          type: string
        ddl:
          type: string
          description: Must be valid SQL DDL (validated at submission)
        rollback_ddl:
          type: string
        direction:
          type: string
          enum: [up, down]
        database_name:
          type: string
        schema_version:
          type: string
    TerraformPlan:
      type: object
      required: [plan_json, provider]
      description: Terraform plan output (JSON).
      properties:
        plan_json:
          type: string
          description: Must be valid JSON
        resource_changes:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
              type:
                type: string
              name:
                type: string
              change_action:
                type: string
                enum: [create, update, delete, replace, no-op]
        provider:
          type: string
        workspace:
          type: string
        state_version:
          type: integer
    CodePlan:
      type: object
      required: [file_path, language, hunks]
      description: AST diff representation for code changes.
      properties:
        file_path:
          type: string
        language:
          type: string
        before_hash:
          type: string
        after_hash:
          type: string
        hunks:
          type: array
          items:
            type: object
            required: [content, operation]
            properties:
              start_line:
                type: integer
              end_line:
                type: integer
              content:
                type: string
              operation:
                type: string
                enum: [add, remove, modify]
    ShellPlan:
      type: object
      required: [commands, side_effect_manifest]
      description: Shell commands with explicit side-effect manifest. No untyped prose allowed.
      properties:
        commands:
          type: array
          items:
            type: object
            required: [command]
            properties:
              command:
                type: string
              description:
                type: string
              idempotent:
                type: boolean
              timeout:
                type: string
        working_dir:
          type: string
        environment:
          type: object
          additionalProperties:
            type: string
        side_effect_manifest:
          type: object
          description: >
            Declarative permission boundary for shell execution. The sandbox enforces this
            manifest at runtime; the classifier reads it (not the script) to determine risk.
            Wildcard operations widen classification automatically.
          properties:
            file_ops:
              type: array
              description: File system operations the script may perform.
              items:
                type: object
                required: [action, path]
                properties:
                  action:
                    type: string
                    enum: [read, write, delete]
                  path:
                    type: string
                    description: Glob pattern for affected files (e.g., "/app/dist/**")
            network_ops:
              type: array
              description: Outbound network operations the script may perform.
              items:
                type: object
                required: [endpoint, method]
                properties:
                  endpoint:
                    type: string
                    description: Target host:port or URL pattern
                  method:
                    type: string
                    enum: [GET, POST, PUT, DELETE, PATCH, HEAD, OPTIONS, TCP, UDP]
                  idempotent:
                    type: boolean
                    description: Whether this call is safe to retry
            process_ops:
              type: array
              description: Subprocesses the script may spawn.
              items:
                type: object
                required: [binary]
                properties:
                  binary:
                    type: string
                    description: Executable name or path
                  args:
                    type: array
                    items:
                      type: string
                    description: Allowed argument patterns (glob-matched)
            credential_ops:
              type: array
              description: Secrets/credentials the script will access.
              items:
                type: object
                required: [name]
                properties:
                  name:
                    type: string
                    description: Credential identifier (env var name or secret path)
                  purpose:
                    type: string
                    description: Why this credential is needed (for audit)
            resource_limits:
              type: object
              description: Upper bounds on resource consumption for sandbox enforcement.
              properties:
                max_runtime_seconds:
                  type: integer
                  description: Maximum wall-clock time (0 = system default)
                max_disk_write_bytes:
                  type: integer
                  format: int64
                  description: Maximum total writable bytes (0 = system default)
                max_network_calls:
                  type: integer
                  description: Maximum outbound connections (0 = system default)
    DeployPlan:
      type: object
      required: [artifact_hash, target, deploy_strategy]
      description: Deploy plan referencing specific artifact hash and target.
      properties:
        artifact_hash:
          type: string
        artifact_url:
          type: string
        target:
          type: string
        deploy_strategy:
          type: string
          enum: [rolling, blue-green, canary, recreate]
        health_check_url:
          type: string
        rollback_hash:
          type: string
        replicas:
          type: integer
    PlanVersion:
      type: object
      properties:
        id:
          type: string
        plan_id:
          type: string
        version:
          type: integer
        content:
          $ref: '#/components/schemas/PlanContent'
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    CreatePlanRequest:
      type: object
      required: [ticket_id, backend, content]
      properties:
        ticket_id:
          type: string
        backend:
          type: string
          enum: [database, terraform, code, shell, deploy]
        content:
          description: Backend-specific content object (must match backend type schema)
          type: object
        created_by:
          type: string
        freshness_stamp:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    UpdatePlanContentRequest:
      type: object
      required: [content]
      properties:
        content:
          description: New backend-specific content (re-validated against schema)
          type: object
        updated_by:
          type: string
    # --- Policy calibration schemas ---
    PolicyCondition:
      type: object
