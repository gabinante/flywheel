openapi: 3.0.3
info:
  title: Warrant API
  description: REST API for Warrant ticketing (orgs, projects, tickets, reviews, queue).
  version: 0.1.0
servers:
  - url: http://localhost:8080
    description: Local
paths:
  /healthz:
    get:
      operationId: GetHealthz
      summary: Liveness/readiness
      responses:
        "200":
          description: OK
  /me/stats:
    get:
      operationId: GetMeStats
      summary: Lifetime stats for the authenticated agent (tickets created, reviews approved/rejected). For gamification.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeStats'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /me/stats/history:
    get:
      operationId: GetMeStatsHistory
      summary: Daily activity counts for the last N days (for activity graph). Oldest day first.
      security:
        - BearerAuth: []
      parameters:
        - name: days
          in: query
          description: Number of days (default 14, max 90).
          schema:
            type: integer
            default: 14
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeStatsHistory'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs:
    get:
      operationId: ListOrgs
      summary: List organizations for the authenticated user (OAuth required)
      security:
        - BearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Org'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: CreateOrg
      summary: Create organization (auth required)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs/{orgID}:
    get:
      operationId: GetOrg
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs/{orgID}/projects:
    get:
      operationId: ListProjectsByOrg
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Filter by project status; default active.
          schema:
            type: string
            enum: [active, closed, all]
            default: active
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
    post:
      operationId: CreateProject
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}:
    get:
      operationId: GetProject
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    patch:
      operationId: UpdateProject
      summary: Update project (e.g. set status to active or closed)
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        "400":
          description: Bad request (e.g. invalid status)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/work-streams:
    get:
      operationId: ListWorkStreams
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          description: Filter by status; default active.
          schema:
            type: string
            enum: [active, closed, all]
            default: active
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkStream'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: CreateWorkStream
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkStreamRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStream'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/work-streams/{workStreamID}:
    get:
      operationId: GetWorkStream
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: workStreamID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStream'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    patch:
      operationId: UpdateWorkStream
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: workStreamID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkStreamRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkStream'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/tickets:
    get:
      operationId: ListTickets
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: work_stream_id
          in: query
          description: Filter by work stream.
          schema:
            type: string
        - name: state
          in: query
          description: Filter by ticket state.
          schema:
            type: string
            enum: [draft, specced, planning, awaiting_input, executing, awaiting_validation, validated, deploying, observing, closed, pending, claimed, awaiting_review, done, blocked, needs_human, failed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: CreateTicket
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTicketRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}:
    get:
      operationId: GetTicket
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    patch:
      operationId: UpdateTicket
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTicketRequest'
      responses:
        "204":
          description: No content
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/reviews:
    get:
      operationId: ListPendingReviews
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingReviewsResponse'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/reviews:
    post:
      operationId: CreateReview
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/trace:
    get:
      operationId: GetTrace
      summary: Execution trace (steps logged by the agent while working)
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionTrace'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
    post:
      operationId: LogStep
      summary: Append a step to the execution trace (requires valid lease)
      security:
        - BearerAuth: []
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogStepRequest'
      responses:
        "204":
          description: No content
        "400":
          description: Bad request (e.g. missing lease_token or step.type)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/transitions:
    post:
      operationId: TransitionTicket
      summary: Transition ticket state (e.g. start, submit, approve, reject)
      security:
        - BearerAuth: []
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad request (e.g. trigger required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /orgs/{orgID}/projects/{projectID}/git-notes/commits/{commitSha}:
    get:
      operationId: GetCommitNotes
      summary: Get git notes for a commit (requires repo_path query; server returns 501 if repo not accessible)
      security:
        - BearerAuth: []
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: commitSha
          in: path
          required: true
          schema:
            type: string
        - name: repo_path
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: Note type (decision, trace, or intent); omit for all types
          schema:
            type: string
            enum: [decision, trace, intent]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitNotesResponse'
        "404":
          description: Not found (project or org mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "501":
          description: Not implemented (repo_path missing or not a git repo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedError'
  /orgs/{orgID}/projects/{projectID}/git-notes/log:
    get:
      operationId: GetGitNotesLog
      summary: List commits with notes (requires repo_path query; server returns 501 if repo not accessible)
      security:
        - BearerAuth: []
      parameters:
        - name: orgID
          in: path
          required: true
          schema:
            type: string
        - name: projectID
          in: path
          required: true
          schema:
            type: string
        - name: repo_path
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          description: Note type (default decision)
          schema:
            type: string
            enum: [decision, trace, intent]
            default: decision
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitNotesLogResponse'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "501":
          description: Not implemented (repo_path missing or not a git repo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotImplementedError'
  /projects/{projectID}/escalations:
    get:
      operationId: ListEscalations
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Escalation'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/escalations/{escalationID}/resolve:
    post:
      operationId: ResolveEscalation
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
        - name: escalationID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveEscalationRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /projects/{projectID}/queue/claim:
    post:
      operationId: ClaimTicket
      parameters:
        - name: projectID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponseBody'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "500":
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/lease/renew:
    post:
      operationId: RenewLease
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewLeaseRequest'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewLeaseResponseBody'
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /tickets/{ticketID}/lease:
    delete:
      operationId: ReleaseLease
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
        - name: lease_token
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                lease_token:
                  type: string
      responses:
        "204":
          description: No content
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  # --- Plan endpoints (first-class plan entity) ---
  /plans:
    post:
      operationId: CreatePlan
      summary: Create a typed execution plan for a ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        "400":
          description: Bad request (validation failure — e.g., invalid DDL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /plans/{planID}:
    get:
      operationId: GetPlan
      summary: Get a plan by ID
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /plans/{planID}/content:
    put:
      operationId: UpdatePlanContent
      summary: Update plan content (draft state only, re-validates against backend schema)
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlanContentRequest'
      responses:
        "204":
          description: Updated
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /plans/{planID}/transition:
    post:
      operationId: TransitionPlan
      summary: Transition plan state (submit, classify, approve, apply, reject)
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [submit, classify, approve, apply, reject]
      responses:
        "200":
          description: Transitioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
        "400":
          description: Invalid transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredError'
  /plans/{planID}/versions:
    get:
      operationId: ListPlanVersions
      summary: List version history of a plan
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanVersion'
  /plans/{planID}/freshness:
    get:
      operationId: CheckPlanFreshness
      summary: Check if a plan is still fresh (not expired for re-plan-before-apply)
      parameters:
        - name: planID
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_id:
                    type: string
                  fresh:
                    type: boolean
  /tickets/{ticketID}/plans:
    get:
      operationId: ListPlansByTicket
      summary: List all plans linked to a ticket
      parameters:
        - name: ticketID
          in: path
          required: true
          schema:
            type: string
        - name: backend
          in: query
          description: Filter by backend type
          schema:
            type: string
            enum: [database, terraform, code, shell, deploy]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    MeStats:
      type: object
      required: [tickets_created, reviews_approved, reviews_rejected]
      properties:
        tickets_created:
          type: integer
          description: Total tickets created by this agent
        reviews_approved:
          type: integer
          description: Total reviews approved by this agent
        reviews_rejected:
          type: integer
          description: Total reviews rejected by this agent
    MeStatsHistory:
      type: object
      required: [days, tickets_created, reviews_approved, reviews_rejected]
      properties:
        days:
          type: array
          items:
            type: string
            format: date
          description: Date strings (YYYY-MM-DD) oldest first
        tickets_created:
          type: array
          items:
            type: integer
          description: Ticket count per day
        reviews_approved:
          type: array
          items:
            type: integer
        reviews_rejected:
          type: array
          items:
            type: integer
    StructuredError:
      type: object
      required: [error, code, retriable]
      properties:
        error:
          type: string
        code:
          type: string
          enum: [lease_expired, unauthorized, not_found, conflict, invalid_input, forbidden, internal, not_implemented, project_closed]
        retriable:
          type: boolean
    NotImplementedError:
      type: object
      description: Returned when server cannot access repo (e.g. git-notes without repo_path)
      properties:
        error:
          type: string
        code:
          type: string
          enum: [not_implemented]
    LogStepRequest:
      type: object
      required: [lease_token, step]
      properties:
        lease_token:
          type: string
        step:
          $ref: '#/components/schemas/TraceStepInput'
    TraceStepInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [tool_call, observation, thought, error]
        payload:
          type: object
    TransitionRequest:
      type: object
      required: [trigger]
      properties:
        trigger:
          type: string
        actor_id:
          type: string
        actor:
          type: string
          enum: [human, agent, system]
        payload:
          type: object
    CommitNotesResponse:
      type: object
      properties:
        commit_sha:
          type: string
        notes:
          type: object
          additionalProperties:
            type: string
    GitNotesLogResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/GitNotesLogEntry'
    GitNotesLogEntry:
      type: object
      properties:
        commit_sha:
          type: string
        ref:
          type: string
        body:
          type: string
    Org:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        created_at:
          type: string
          format: date-time
    CreateOrgRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
    Project:
      type: object
      properties:
        id:
          type: string
        org_id:
          type: string
        name:
          type: string
        slug:
          type: string
        repo_url:
          type: string
        default_branch:
          type: string
          description: Branch to checkout when closing a work stream; default "main".
        tech_stack:
          type: array
          items:
            type: string
        context_pack:
          type: object
        status:
          type: string
          enum: [active, closed]
          description: active (default) or closed; list endpoints default to active only.
        created_at:
          type: string
          format: date-time
    UpdateProjectRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, closed]
        name:
          type: string
          description: Project display name.
        slug:
          type: string
          description: URL-safe identifier (unique per org).
        repo_url:
          type: string
          description: Git repo URL; when set, enables work streams + git integration (branch instructions in MCP).
        default_branch:
          type: string
          description: Branch to checkout when closing a work stream; default "main".
    WorkStream:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          description: Markdown implementation plan (GFM, fenced code, Mermaid diagrams).
        branch:
          type: string
        status:
          type: string
          enum: [active, closed]
        created_at:
          type: string
          format: date-time
    CreateWorkStreamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        slug:
          type: string
        plan:
          type: string
          description: Optional Markdown plan body.
    UpdateWorkStreamRequest:
      type: object
      properties:
        name:
          type: string
        plan:
          type: string
          description: Markdown plan; send empty string to clear.
        branch:
          type: string
        status:
          type: string
          enum: [active, closed]
    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        repo_url:
          type: string
        tech_stack:
          type: array
          items:
            type: string
    Objective:
      type: object
      properties:
        description:
          type: string
        success_criteria:
          type: array
          items:
            type: string
        acceptance_test:
          type: string
    TicketContext:
      type: object
      properties:
        relevant_files:
          type: array
          items:
            type: string
        constraints:
          type: array
          items:
            type: string
        prior_attempts:
          type: array
          items:
            type: object
        human_answers:
          type: array
          items:
            type: string
    Ticket:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [task, bug, spike, review]
        priority:
          type: integer
          minimum: 0
          maximum: 3
        state:
          type: string
          enum: [draft, specced, planning, awaiting_input, executing, awaiting_validation, validated, deploying, observing, closed, pending, claimed, awaiting_review, done, blocked, needs_human, failed]
        version:
          type: integer
        objective:
          $ref: '#/components/schemas/Objective'
        ticket_context:
          $ref: '#/components/schemas/TicketContext'
        inputs:
          type: object
        outputs:
          type: object
        depends_on:
          type: array
          items:
            type: string
        work_stream_id:
          type: string
        assigned_to:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateTicketRequest:
      type: object
      required: [title, created_by]
      properties:
        title:
          type: string
        work_stream_id:
          type: string
        type:
          type: string
          enum: [task, bug, spike, review]
        priority:
          type: integer
          minimum: 0
          maximum: 3
        created_by:
          type: string
        depends_on:
          type: array
          items:
            type: string
        objective:
          $ref: '#/components/schemas/Objective'
        ticket_context:
          $ref: '#/components/schemas/TicketContext'
        idempotency_key:
          type: string
          description: Optional. Duplicate requests with the same key return the existing ticket.
    UpdateTicketRequest:
      type: object
      properties:
        depends_on:
          type: array
          items:
            type: string
        title:
          type: string
          description: When set, replaces the ticket title.
        objective:
          $ref: '#/components/schemas/Objective'
          description: Partial update; only fields present in the body are merged into the existing objective. Task/bug tickets must still have at least one of success_criteria or acceptance_test after the merge.
    CreateReviewRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected, reopened]
          description: >
            approved moves awaiting_validation → validated; rejected moves awaiting_validation → executing;
            reopened moves closed → draft (re-opens ticket for new lifecycle).
        notes:
          type: string
        reviewer_id:
          type: string
    ExecutionTrace:
      type: object
      properties:
        ticket_id:
          type: string
        agent_id:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TraceStep'
    TraceStep:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [tool_call, observation, thought, error]
        payload:
          type: object
        created_at:
          type: string
          format: date-time
    PendingReviewsResponse:
      type: object
      properties:
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
    Escalation:
      type: object
      properties:
        id:
          type: string
        ticket_id:
          type: string
        agent_id:
          type: string
        reason:
          type: string
        question:
          type: string
        answer:
          type: string
        resolved_by:
          type: string
        resolved_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    ResolveEscalationRequest:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
        reviewer_id:
          type: string
    ClaimRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id:
          type: string
        priority:
          type: integer
          minimum: 0
          maximum: 3
        idempotency_key:
          type: string
          description: Optional. Retries with the same key return the same ticket/lease (renewed or re-claimed).
    ClaimResponseBody:
      type: object
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        lease:
          $ref: '#/components/schemas/Lease'
    Lease:
      type: object
      properties:
        ticket_id:
          type: string
        agent_id:
          type: string
        token:
          type: string
        expires_at:
          type: string
          format: date-time
        renewable:
          type: boolean
    RenewLeaseRequest:
      type: object
      required: [lease_token]
      properties:
        lease_token:
          type: string
    RenewLeaseResponseBody:
      type: object
      properties:
        expires_at:
          type: string
          format: date-time
    # --- Plan schemas ---
    Plan:
      type: object
      properties:
        id:
          type: string
        ticket_id:
          type: string
        backend:
          type: string
          enum: [database, terraform, code, shell, deploy]
        state:
          type: string
          enum: [draft, submitted, classified, approved, applied, superseded, rejected]
        version:
          type: integer
        content:
          $ref: '#/components/schemas/PlanContent'
        freshness_stamp:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PlanContent:
      type: object
      description: >
        Union type — exactly one backend sub-schema is populated.
        No untyped escape hatch; agent cannot express classification-evading content.
      properties:
        database:
          $ref: '#/components/schemas/DatabasePlan'
        terraform:
          $ref: '#/components/schemas/TerraformPlan'
        code:
          $ref: '#/components/schemas/CodePlan'
        shell:
          $ref: '#/components/schemas/ShellPlan'
        deploy:
          $ref: '#/components/schemas/DeployPlan'
    DatabasePlan:
      type: object
      required: [migration_name, ddl, direction]
      description: Database migration plan. DDL must be valid SQL — prose fails validation.
      properties:
        migration_name:
          type: string
        ddl:
          type: string
          description: Must be valid SQL DDL (validated at submission)
        rollback_ddl:
          type: string
        direction:
          type: string
          enum: [up, down]
        database_name:
          type: string
        schema_version:
          type: string
    TerraformPlan:
      type: object
      required: [plan_json, provider]
      description: Terraform plan output (JSON).
      properties:
        plan_json:
          type: string
          description: Must be valid JSON
        resource_changes:
          type: array
          items:
            type: object
            properties:
              address:
                type: string
              type:
                type: string
              name:
                type: string
              change_action:
                type: string
                enum: [create, update, delete, replace, no-op]
        provider:
          type: string
        workspace:
          type: string
        state_version:
          type: integer
    CodePlan:
      type: object
      required: [file_path, language, hunks]
      description: AST diff representation for code changes.
      properties:
        file_path:
          type: string
        language:
          type: string
        before_hash:
          type: string
        after_hash:
          type: string
        hunks:
          type: array
          items:
            type: object
            required: [content, operation]
            properties:
              start_line:
                type: integer
              end_line:
                type: integer
              content:
                type: string
              operation:
                type: string
                enum: [add, remove, modify]
    ShellPlan:
      type: object
      required: [commands, side_effect_manifest]
      description: Shell commands with explicit side-effect manifest. No untyped prose allowed.
      properties:
        commands:
          type: array
          items:
            type: object
            required: [command]
            properties:
              command:
                type: string
              description:
                type: string
              idempotent:
                type: boolean
              timeout:
                type: string
        working_dir:
          type: string
        environment:
          type: object
          additionalProperties:
            type: string
        side_effect_manifest:
          type: object
          properties:
            files_created:
              type: array
              items:
                type: string
            files_modified:
              type: array
              items:
                type: string
            files_deleted:
              type: array
              items:
                type: string
            network_access:
              type: array
              items:
                type: string
            processes_spawned:
              type: array
              items:
                type: string
            env_vars_set:
              type: array
              items:
                type: string
    DeployPlan:
      type: object
      required: [artifact_hash, target, deploy_strategy]
      description: Deploy plan referencing specific artifact hash and target.
      properties:
        artifact_hash:
          type: string
        artifact_url:
          type: string
        target:
          type: string
        deploy_strategy:
          type: string
          enum: [rolling, blue-green, canary, recreate]
        health_check_url:
          type: string
        rollback_hash:
          type: string
        replicas:
          type: integer
    PlanVersion:
      type: object
      properties:
        id:
          type: string
        plan_id:
          type: string
        version:
          type: integer
        content:
          $ref: '#/components/schemas/PlanContent'
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    CreatePlanRequest:
      type: object
      required: [ticket_id, backend, content]
      properties:
        ticket_id:
          type: string
        backend:
          type: string
          enum: [database, terraform, code, shell, deploy]
        content:
          description: Backend-specific content object (must match backend type schema)
          type: object
        created_by:
          type: string
        freshness_stamp:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    UpdatePlanContentRequest:
      type: object
      required: [content]
      properties:
        content:
          description: New backend-specific content (re-validated against schema)
          type: object
        updated_by:
          type: string
