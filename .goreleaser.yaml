version: 2
project_name: flywheel

builds:
  - id: flywheel
    main: ./cmd/server
    binary: flywheel
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: flywheel-git
    main: ./cmd/flywheel-git
    binary: flywheel-git
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: flywheel-mcp
    main: ./cmd/mcp
    binary: flywheel-mcp
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: flywheel
    ids: [flywheel]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: flywheel-git
    ids: [flywheel-git]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: flywheel-mcp
    ids: [flywheel-mcp]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

release:
  github:
    owner: '{{ envOrDefault "GITHUB_REPOSITORY_OWNER" "gabinante" }}'
    name: flywheel
  name_template: "{{ .Tag }}"
