app = "ghp-api"
primary_region = "ord"

[build]
  dockerfile = "deploy/Dockerfile.backend"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2
  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/health"
    interval = "15s"
    timeout = "5s"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOST = "0.0.0.0"
  NMI_MOCK_MODE = "false"
  SEAMLESSCHEX_SANDBOX = "false"
  ADMIN_URL = "https://admin.gohighpayment.com"
  MERCHANT_URL = "https://merchant.gohighpayment.com"
  CHECKOUT_URL = "https://checkout.gohighpayment.com"
  API_BASE_URL = "https://api.gohighpayment.com"
  FRONTEND_URL = "https://checkout.gohighpayment.com"
  GHL_REDIRECT_URI = "https://api.gohighpayment.com/api/v1/ghl/callback"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

# Autoscaling
[metrics]
  port = 3000
  path = "/metrics"
