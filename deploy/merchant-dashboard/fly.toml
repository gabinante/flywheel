# Fly.io deployment configuration for GoHighPayment Merchant Dashboard
# Static Vite build served via lightweight HTTP server

app = "gohighpayment-merchant"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile.frontend"
  [build.args]
    PACKAGE = "merchant-dashboard"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
