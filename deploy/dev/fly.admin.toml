app = "ghp-dev-admin"
primary_region = "ord"

[build]
  dockerfile = "deploy/Dockerfile.frontend"
  [build.args]
    PACKAGE = "admin-dashboard"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
