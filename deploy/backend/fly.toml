# Fly.io deployment configuration for GoHighPayment Backend
# See https://fly.io/docs/reference/configuration/

app = "gohighpayment-backend"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile.backend"

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  NODE_ENV = "production"
  LOG_LEVEL = "info"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
