version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gohighpayment
      POSTGRES_PASSWORD: gohighpayment
      POSTGRES_DB: gohighpayment
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gohighpayment']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    ports:
      - '3000:3000'
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        PACKAGE: admin-dashboard
        PORT: '5174'
    ports:
      - '5174:5174'
    env_file:
      - .env

  merchant-dashboard:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        PACKAGE: merchant-dashboard
        PORT: '5175'
    ports:
      - '5175:5175'
    env_file:
      - .env

  checkout:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        PACKAGE: checkout
        PORT: '5176'
    ports:
      - '5176:5176'
    env_file:
      - .env

volumes:
  pgdata:
  redisdata:
