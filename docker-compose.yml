services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flywheel
      POSTGRES_PASSWORD: flywheel
      POSTGRES_DB: flywheel
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flywheel -d flywheel"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5

  # Browser GitHub OAuth: set BASE_URL=http://localhost:8080 in .env so redirects match this port mapping (see .env.example).
  # Secrets are loaded via varlock inside the container (validates against .env.schema).
  server:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://flywheel:flywheel@postgres:5432/flywheel?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      VARLOCK_SCHEMA_FILE: /app/.env.schema
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin-dashboard:
    build:
      context: ./packages/admin-dashboard
      dockerfile: Dockerfile
    ports:
      - "5176:5176"
    environment:
      VITE_API_URL: http://server:3000
