name: flywheel

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flywheel
      POSTGRES_PASSWORD: flywheel
      POSTGRES_DB: flywheel
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flywheel -d flywheel"]
      interval: 2s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 5


volumes:
  pgdata:
